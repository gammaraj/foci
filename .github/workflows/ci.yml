name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit

      - name: Validate RLS policy names in migrations
        run: npm run check:rls-policies

      - name: Validate admin allowlist sync
        run: npm run check:admin-allowlist

      - name: Build
        run: npm run build

      - name: Validate sitemap, SEO/AEO and llms sync
        run: npm run check:content-integrity

      - name: Install Playwright browsers
        run: npx playwright install chromium

      - name: E2E tests
        continue-on-error: true
        run: npm run test
