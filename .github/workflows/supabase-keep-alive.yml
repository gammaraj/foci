name: Supabase keep-alive

on:
  schedule:
    # Twice daily — Supabase free tier pauses after ~7 days of DB inactivity.
    # Offset from Vercel cron (12:00 UTC) so one path can cover the other.
    - cron: '0 1 * * *'
    - cron: '0 13 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Require CRON_SECRET
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET GitHub Actions secret is missing. Add it in repo Settings → Secrets."
            exit 1
          fi

      - name: Ping keep-alive endpoint
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl -fsS --retry 5 --retry-delay 15 --retry-all-errors \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "https://usefoci.com/api/keep-alive"
